{% if video.catalog_collection_id %}
<div class="inline-form video-content-type-control">
  <label>Typ obsahu <select name="content_type" form="video-edit-{{ video.id }}" aria-label="Typ obsahu videa">
    <option value="" {% if video.content_type_manual is none %}selected{% endif %}>automaticky</option>
    {% for value, label in video_content_type_choices %}<option value="{{ value }}" {% if video.content_type_manual == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select></label>
</div>
{% endif %}
<details class="technical-details"><summary>Parserová evidence</summary><small>Raw typ: {{ video.file_type }} · {{ detect_episode_number(video.filename).display_value or 'číslo neurčeno' }}</small></details>
