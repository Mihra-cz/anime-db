# LAB ONLY. Two lab identities; the server, not the client mount, enforces RO.
[global]
    server role = standalone server
    workgroup = ANIMEDBLAB
    security = user
    map to guest = never
    server min protocol = SMB3_11
    disable netbios = yes
    smb ports = 445
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    store dos attributes = no
    map archive = no
    map hidden = no
    map system = no
    map readonly = no
    kernel oplocks = no
    strict sync = yes
    log level = 1

[animelab]
    path = /share
    browseable = no
    valid users = lab_scan lab_worker
    read only = yes
    write list = lab_worker
    force user = labfiles
    force group = labfiles
    create mask = 0644
    directory mask = 0755
