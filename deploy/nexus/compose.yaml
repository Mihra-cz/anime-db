# Single AnimeDB installation. Do not merge with the root development Compose.
name: anime-db

services:
  app:
    image: anime-db:nexus
    platform: linux/arm64
    build:
      context: /srv/nexus/projects/anime-db/src
      dockerfile: Dockerfile
      args:
        APP_UID: ${ANIMEDB_UID:-1000}
        APP_GID: ${ANIMEDB_GID:-1000}
    user: "${ANIMEDB_UID:-1000}:${ANIMEDB_GID:-1000}"
    working_dir: /app
    entrypoint: [python, /usr/local/libexec/anime-db/nexus_first_run.py]
    command: [uvicorn, "app.main:app", --host, 0.0.0.0, --port, "8000"]
    environment:
      DATABASE_URL: sqlite:///file:///data/anime.db?mode=rw&uri=true
      ANIME_PATH: /media/anime
      REQUIRE_MOUNT: "true"
      METADATA_ARTWORK_DIRECTORY: /artwork
      METADATA_ENABLED: "false"
      ANILIST_ENABLED: "false"
      METADATA_DOWNLOAD_ARTWORK: "false"
      METADATA_ALLOW_REMOTE_IMAGES: "false"
      METADATA_AUTO_CONFIRM: "false"
    ports:
      - "192.168.11.238:8000:8000"
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - type: bind
        source: /mnt/nas-anime
        target: /media/anime
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: /srv/nexus/appdata/anime-db/db
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nexus/appdata/anime-db/state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nexus/appdata/anime-db/artwork
        target: /artwork
        bind:
          create_host_path: false
