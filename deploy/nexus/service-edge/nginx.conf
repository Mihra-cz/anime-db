worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        client_max_body_size 0;
        location = /_service/index.html {
            internal;
            alias /service/index.html;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location = /_service/workflow {
            alias /service/index.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location = /_service/control/cleanup {
            client_max_body_size 2m;
            proxy_pass http://unix:/run/animedb-control/coordinator.sock:/cleanup;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream off;
            add_header Cache-Control "no-store" always;
        }
        location = /_service/control/cleanup/proposal {
            proxy_pass http://unix:/run/animedb-control/coordinator.sock:/cleanup/proposal;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location = /_service/service.js {
            alias /service/service.js;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location = /_service/progress.json {
            alias /public-status/progress.json;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location = /_service/app-health {
            set $backend app:8000;
            proxy_pass http://$backend/health;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }
        location /_service/ { return 404; }
        location / {
            set $backend app:8000;
            proxy_pass http://$backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_next_upstream off;
            # Preview/approval inspect has a 600s default; execution is detached.
            proxy_read_timeout 660s;
            proxy_max_temp_file_size 0;
            error_page 502 504 =503 /_service/index.html;
        }
    }
}
