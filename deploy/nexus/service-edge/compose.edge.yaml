# Optional, NOT DEPLOYED. Merge after ../compose.yaml; requires Compose !reset.
services:
  app:
    ports: !reset []
  edge:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: "101:101"
    entrypoint: [nginx]
    command: [-c, /service/nginx.conf, -g, "daemon off;"]
    ports:
      - "192.168.11.238:8000:8080"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: /srv/nexus/projects/anime-db/src/deploy/nexus/service-edge
        target: /service
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nexus/appdata/anime-db/service
        target: /public-status
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/animedb-reorganization
        target: /run/animedb-control
        read_only: true
        bind:
          create_host_path: false
    # Static assets, public summary and narrow cleanup socket; no DB/NAS/Docker.
    working_dir: /tmp
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
