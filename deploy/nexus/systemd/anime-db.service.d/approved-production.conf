# Applied to the audited existing anime-db.service, never a second installation.
# Keep its Requires/After=animedb-lan-fw.service and mount dependencies intact.
[Service]
WorkingDirectory=/
# RO check + bounded Compose calls + up to 900 s for NORMAL admission/health.
TimeoutStartSec=1500
ExecStart=
ExecStart=/usr/local/libexec/anime-db/autostart.sh
ExecStop=
ExecStop=/usr/bin/python3 /usr/local/libexec/anime-db/reorganization_autostart.py stop
